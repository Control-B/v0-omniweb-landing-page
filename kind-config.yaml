# Kind configuration for local development
# This creates a single-node Kind cluster named "omniweb"
# with port mappings for ingress (Traefik will use NodePort 30080/30443)
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
