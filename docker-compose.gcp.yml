name: omniweb-contact-center

services:
  # ── 1. PostgreSQL with pgvector for Enterprise RAG ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniweb_engine}
      POSTGRES_USER: ${POSTGRES_USER:-omniweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniweb_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniweb -d omniweb_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Redis Session Cache & Event Bus ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-omniweb_redis_secure_pass_2026} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-omniweb_redis_secure_pass_2026} ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 3. FastAPI & LangGraph Contact Center Engine ────────────────────────────
  backend:
    build:
      context: ./backend
      target: api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.gcp
    environment:
      DATABASE_URL: postgresql+asyncpg://omniweb:${POSTGRES_PASSWORD:-omniweb_secure_pwd_2026}@postgres:5432/${POSTGRES_DB:-omniweb_engine}
      REDIS_URL: redis://:${REDIS_PASSWORD:-omniweb_redis_secure_pass_2026}@redis:6379/0
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-c8d2e4f6a1b3c5e7f9a0b2d4e6f8a1c3e5b7d9f1a2c4e6a8b0d2f4e6a8c0b2d4}
      SECRET_KEY: ${SECRET_KEY:-9f83b2a7d4e16c5082e3b1c97a48d2f6e5b0c3a8d1e7f9a2b4c6e8d0f1a3b5c7}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-e4b7c1a9d2f803e5b6c8a1d7f4e2b0c9a3d5e7f1b2c4e6a8d0f2a4b6c8e0d1f3}
      ENVIRONMENT: production
      ENABLE_LANGGRAPH: "true"
      ENABLE_LIVEKIT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 4. LiveKit Contact Center Voice Agent Worker ────────────────────────────
  agent-worker:
    build:
      context: ./backend
      target: api
    restart: always
    command: ["python", "/app/agent/agent.py"]
    volumes:
      - ./agent:/app/agent
    env_file:
      - .env.gcp
    environment:
      DATABASE_URL: postgresql+asyncpg://omniweb:${POSTGRES_PASSWORD:-omniweb_secure_pwd_2026}@postgres:5432/${POSTGRES_DB:-omniweb_engine}
      REDIS_URL: redis://:${REDIS_PASSWORD:-omniweb_redis_secure_pass_2026}@redis:6379/0
    depends_on:
      backend:
        condition: service_started

  # ── 5. Next.js 16 Web Application Frontend ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.gcp
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_OMNIWEB_ENGINE_URL: http://backend:8000
    depends_on:
      - backend

  # ── 6. Caddy Reverse Proxy (Automatic HTTPS / SSL) ─────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.gcp
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-136.114.167.50.sslip.io}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
